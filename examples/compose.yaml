# Runnable LabSSO compose: host TCP 443 -> container :10443 (dest-443).
# Management stays off 443 (loopback 8080). UID 65532, read-only, cap_drop ALL.
#
# Secret files are the committed Wave 0 testdata PEMs and token (0644).
# Relative YAML refs resolve from container WORKDIR / via the /testdata/secrets mount.
#
# Host 443 occupancy is an integrator/mcplab check. If publish fails for a
# reason other than container EACCES/EPERM, labsso emit the three-fix text:
# stop/disable occupant (nginx, caddy, apache, another compose stack), extra IP
# for LAB_PUBLIC_HOST, or escape LABSSO_HTTPS_PORT.

services:
  labsso:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/hilather/labsso:local
    command: ["serve", "--config=/etc/labsso/config.yaml"]
    user: "65532:65532"
    ports:
      - "443:10443/tcp"
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - "../testdata/config/valid/minimal.yaml:/etc/labsso/config.yaml:ro"
      - "../testdata/secrets:/testdata/secrets:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/labsso", "healthcheck", "--url=http://127.0.0.1:8080/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
