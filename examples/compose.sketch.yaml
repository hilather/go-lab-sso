# LabSSO Compose sketch — NOT runnable until implemented.
#
# This file is a deployment shape for reviewers and the future FND-001 slice.
# There is no ghcr.io/hilather/labsso image and no /labsso binary in this
# repository yet. Do not `docker compose up` this file and expect an IdP.
#
# Mapping: host TCP 443 -> container unprivileged :10443 (dest-443).
# Management stays off 443 (loopback 8080). UID 65532, read-only, cap_drop ALL.
#
# Preflight (when implemented): fail closed if a non-lab process holds host 443.
# Fixes the error must name: stop/disable occupant (nginx, caddy, apache,
# another compose stack) OR extra IP for LAB_PUBLIC_HOST OR escape
# LABSSO_HTTPS_PORT (SUTs that cannot set dest port cannot follow the escape).
# EACCES/EPERM on the container bind is NOT occupancy.

